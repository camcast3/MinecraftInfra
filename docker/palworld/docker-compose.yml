---
# Palworld stack for the dedicated Proxmox VM.
# Deploy this file with Docker Compose directly or through Portainer. Supply
# runtime variables outside Git; never commit a .env file. REST, metrics, and
# container administration remain inside this stack's Tailscale namespace.
# The direct host publication for UDP 8211 is bound only to the Palworld VM's
# LAN address; the host DOCKER-USER policy restricts its source networks to the
# approved player VLANs. The listener is also reachable over the stack's
# tailnet identity for the Azure Nginx ingress.
#
# Host paths and systemd backup units are provisioned by
# infra/proxmox/game-node.

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

x-backup-interface:
  game: palworld
  scheduler: game-backup@palworld.timer
  restore: /usr/local/sbin/game-restore
  sourceHostPath: /data/palworld/server/Pal/Saved
  localHostPath: /data/palworld/backups/local
  healthHostPath: /data/palworld/backups/health
  nasHostPath: /mnt/nas-backups/palworld
  azureContainer: palworld-backups
  retentionDays:
    local: 14
    nas: 7
    azureCold: 90
  preBackupMethod: POST
  preBackupUrl: http://127.0.0.1:8212/v1/api/save
  announceUrl: http://127.0.0.1:8212/v1/api/announce
  shutdownUrl: http://127.0.0.1:8212/v1/api/shutdown
  healthUrl: http://127.0.0.1:8212/v1/api/info
  basicAuthEnvironment: ADMIN_PASSWORD

services:
  tailscale:
    <<: *common
    image: tailscale/tailscale:v1.102.3@sha256:51fec4863144d6ba0a22504cfb455d020ee0307d0c04eb48f5afee63390bdba0
    container_name: palworld-tailscale
    hostname: palworld-tailscale
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY}
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: --accept-dns=false
      TS_HOSTNAME: ${TS_HOSTNAME:-palworld-stack}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TZ: America/Los_Angeles
    volumes:
      - /data/palworld/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - name: palworld-lan
        target: 8211
        published: "8211"
        host_ip: ${PALWORLD_LAN_IP:?set PALWORLD_LAN_IP}
        protocol: udp
      - name: palworld-dashboard-loopback
        target: 3000
        published: "3000"
        host_ip: 127.0.0.1
        protocol: tcp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test:
        - CMD-SHELL
        - tailscale status --json | grep -Eq '"BackendState"[[:space:]]*:[[:space:]]*"Running"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  palworld:
    <<: *common
    image: thijsvanloef/palworld-server-docker:v2.7.3@sha256:be3ad49e373045a7b60478fd8b7f7411c1e293713dfa4733e563e798f276d688
    container_name: palworld-server
    init: true
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      PUID: ${PALWORLD_PUID:?set PALWORLD_PUID to the data-owner UID}
      PGID: ${PALWORLD_PGID:?set PALWORLD_PGID to the data-owner GID}
      PORT: "8211"
      PLAYERS: ${PALWORLD_PLAYERS:-16}
      SERVER_NAME: ${PALWORLD_SERVER_NAME:-Negative Zone Palworld}
      SERVER_DESCRIPTION: ${PALWORLD_SERVER_DESCRIPTION:-Private Negative Zone Palworld server}
      SERVER_PASSWORD: ${PALWORLD_SERVER_PASSWORD:-}
      ADMIN_PASSWORD: ${PALWORLD_ADMIN_PASSWORD:?set PALWORLD_ADMIN_PASSWORD}
      REST_API_ENABLED: "true"
      REST_API_PORT: "8212"
      RCON_ENABLED: "false"
      COMMUNITY: "false"
      CROSSPLAY_PLATFORMS: "(Steam,Xbox,PS5,Mac)"
      ENABLE_PERF_THREADING_ARGS: "true"
      UPDATE_ON_BOOT: "true"
      AUTO_UPDATE_ENABLED: "false"
      BACKUP_ENABLED: "false"
      LOG_LEVEL: INFO
      TZ: America/Los_Angeles
    volumes:
      - /data/palworld/server:/palworld
    labels:
      cc.negativezone.backup.source: /palworld/Pal/Saved
      cc.negativezone.backup.scheduler: game-backup@palworld.timer
      cc.negativezone.backup.local-host-path: /data/palworld/backups/local
      cc.negativezone.backup.pre-hook: POST http://127.0.0.1:8212/v1/api/save
      cc.negativezone.backup.shutdown-hook: POST http://127.0.0.1:8212/v1/api/shutdown
      cc.negativezone.backup.health: GET http://127.0.0.1:8212/v1/api/info
    stop_grace_period: 2m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 20G
    healthcheck:
      test:
        - CMD-SHELL
        - rest-cli info --no-flush-log >/dev/null
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m

  dashboard:
    <<: *common
    image: ghcr.io/rnz01/palworld-server-dashboard:0.1.3@sha256:826d5aeaf5e2f13ae35e4353deb88d4319e69d7bdec7d5688bd27d76474d20d5
    container_name: palworld-dashboard
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy
      palworld:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      PANEL_INITIAL_ADMIN_PASSWORD: ${PALWORLD_DASHBOARD_PASSWORD:?set PALWORLD_DASHBOARD_PASSWORD}
      PALWORLD_ADMIN_PASSWORD: ${PALWORLD_ADMIN_PASSWORD:?set PALWORLD_ADMIN_PASSWORD}
      PALWORLD_REST_URL: http://127.0.0.1:8212
      PANEL_AUTH_FILE: /app/data/panel-auth.json
      PALWORLD_FPS_SAMPLER: "true"
      PALWORLD_FPS_HISTORY_FILE: /app/data/fps-history.json
      FPS_SAMPLE_SECONDS: "5"
      FPS_WINDOW_MINUTES: "60"
      PALWORLD_PLAYER_ACTIVITY: "true"
      PALWORLD_PLAYER_ACTIVITY_FILE: /app/data/player-activity.json
      PUBLIC_VIEW_ENABLED: "false"
    volumes:
      - palworld-dashboard-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000')
          .then(response => process.exit(response.status < 500 ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: palworld-node-exporter
    network_mode: "service:tailscale"
    pid: host
    depends_on:
      tailscale:
        condition: service_healthy
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
      - --web.listen-address=:9100
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  cadvisor:
    <<: *common
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: palworld-cadvisor
    network_mode: "service:tailscale"
    privileged: true
    depends_on:
      tailscale:
        condition: service_healthy
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  alloy:
    <<: *common
    image: grafana/alloy:v1.11.3@sha256:8c7256f412feb9f5f48f9f6f9394dc97ca887f63dea9304f347970ecc1787669
    container_name: palworld-alloy
    user: "0:0"
    read_only: true
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /data/palworld/monitoring/alloy:/var/lib/alloy
      - /data/palworld/backups/health:/var/log/game-backup:ro
    tmpfs:
      - /tmp
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
        mode: 0444
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

configs:
  alloy_config:
    file: ./alloy.config.alloy

volumes:
  palworld-dashboard-data:
