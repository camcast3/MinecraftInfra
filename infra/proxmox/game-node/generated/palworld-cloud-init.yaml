#cloud-config
# Rendered from infra/proxmox/game-node/cloud-init.yaml.tmpl.
# Profile: Palworld (palworld)
#
# Attach this file as Proxmox vendor data. In the Proxmox Cloud-Init tab, set:
#   User: palworldsvc
#   SSH key: an administrator public key
#
# Tailscale and Portainer enrollment are intentionally completed after boot.

package_update: true
package_upgrade: true

packages:
  - apt-listchanges
  - ca-certificates
  - curl
  - git
  - gnupg
  - qemu-guest-agent
  - rclone
  - ufw
  - unattended-upgrades

write_files:
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  - path: /etc/apt/apt.conf.d/51unattended-upgrades-game-node
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "03:30";

  - path: /etc/ssh/sshd_config.d/60-game-node.conf
    permissions: "0644"
    content: |
      Port 7822
      PasswordAuthentication no
      PermitRootLogin no

  - path: /etc/game-node/profile.env
    permissions: "0644"
    content: |
      GAME_SLUG=palworld
      SERVICE_USER=palworldsvc
      TAILSCALE_HOSTNAME=palworld-proxmox
      DATA_ROOT=/data/palworld

  - path: /etc/game-backup/palworld.env
    permissions: "0640"
    owner: root:root
    content: |
      DATA_ROOT=/data/palworld
      BACKUP_ROOT=/data/palworld/backups
      BACKUP_NAS_ROOT=/mnt/nas-backups
      AZURE_RCLONE_REMOTE=azure
      AZURE_CONTAINER=palworld-backups
      AZURE_RCLONE_CONFIG=/etc/game-backup/rclone.conf
      AZURE_ACCESS_TIER=cold
      CONTAINER_NAME=palworld-server
      BACKUP_SOURCE_NAMES="data"
      BACKUP_CONSISTENCY=palworld-rest-graceful-stop
      BACKUP_STOP_MODE=hook
      BACKUP_QUIESCE_HOOK=/usr/local/libexec/game-backup/palworld
      LOCAL_RETENTION_DAYS=14
      NAS_RETENTION_DAYS=7
      AZURE_RETENTION_DAYS=90
      BACKUP_STALE_AFTER_SECONDS=129600

  - path: /etc/game-backup/rclone.conf.example
    permissions: "0600"
    owner: root:root
    content: |
      [azure]
      type = azureblob
      account = REPLACE_WITH_STORAGE_ACCOUNT
      tenant = REPLACE_WITH_TENANT_ID
      client_id = REPLACE_WITH_GAME_BACKUP_CLIENT_ID
      client_secret = REPLACE_WITH_GAME_BACKUP_CLIENT_SECRET

  - path: /usr/local/libexec/game-backup/palworld
    permissions: "0750"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      IFS=$'\n\t'

      container=${1:?container name is required}
      stop_timeout=${2:?stop timeout is required}

      [[ "$container" == palworld-server ]] || {
        echo "Unexpected Palworld container: $container" >&2
        exit 78
      }
      [[ "$stop_timeout" =~ ^[1-9][0-9]*$ ]] || {
        echo "Stop timeout must be a positive integer" >&2
        exit 78
      }

      health=$(docker inspect -f \
        '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
        "$container")
      [[ "$health" == healthy ]] || {
        echo "Palworld must be healthy before its REST backup hook runs" >&2
        exit 69
      }

      palworld_post() {
        local endpoint=$1
        local payload=${2:-}
        docker exec "$container" /bin/sh -ceu '
          endpoint=$1
          payload=$2
          if [ -n "$payload" ]; then
            curl --fail --silent --show-error --max-time 15 --request POST \
              --user "admin:${PALWORLD_ADMIN_PASSWORD:?}" \
              --header "Content-Type: application/json" --data "$payload" \
              "http://127.0.0.1:8212/v1/api/${endpoint}" >/dev/null
          else
            curl --fail --silent --show-error --max-time 15 --request POST \
              --user "admin:${PALWORLD_ADMIN_PASSWORD:?}" \
              "http://127.0.0.1:8212/v1/api/${endpoint}" >/dev/null
          fi
        ' backup-api "$endpoint" "$payload"
      }

      shutdown_wait=60
      if ((stop_timeout <= shutdown_wait + 15)); then
        shutdown_wait=$((stop_timeout > 15 ? stop_timeout - 15 : 1))
      fi

      palworld_post announce \
        "{\"message\":\"Scheduled backup begins in ${shutdown_wait} seconds\"}"
      palworld_post save
      palworld_post shutdown \
        "{\"waittime\":${shutdown_wait},\"message\":\"Scheduled backup in progress\"}"

  - path: /usr/local/sbin/game-backup
    permissions: "0750"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      IFS=$'\n\t'
      umask 077

      usage() {
        echo "Usage: game-backup --game SLUG [--config PATH] [--dry-run]" >&2
      }

      game=
      config=
      dry_run=false
      while (($#)); do
        case "$1" in
          --game)
            game=${2:-}
            shift 2
            ;;
          --config)
            config=${2:-}
            shift 2
            ;;
          --dry-run)
            dry_run=true
            shift
            ;;
          *)
            usage
            exit 64
            ;;
        esac
      done

      [[ "$game" =~ ^[a-z][a-z0-9-]*$ ]] || {
        usage
        exit 64
      }

      config=${config:-"/etc/game-backup/${game}.env"}
      if [[ -r "$config" ]]; then
        # shellcheck disable=SC1090
        source "$config"
      elif [[ "$dry_run" != true ]]; then
        echo "Backup configuration is not readable: $config" >&2
        exit 78
      fi

      DATA_ROOT=${DATA_ROOT:-"/data/${game}"}
      BACKUP_ROOT=${BACKUP_ROOT:-"${DATA_ROOT}/backups"}
      BACKUP_NAS_ROOT=${BACKUP_NAS_ROOT:-/mnt/nas-backups}
      AZURE_RCLONE_REMOTE=${AZURE_RCLONE_REMOTE:-azure}
      AZURE_CONTAINER=${AZURE_CONTAINER:-"${game}-backups"}
      AZURE_RCLONE_CONFIG=${AZURE_RCLONE_CONFIG:-/etc/game-backup/rclone.conf}
      AZURE_ACCESS_TIER=${AZURE_ACCESS_TIER:-cold}
      CONTAINER_NAME=${CONTAINER_NAME:-"${game}-server"}
      BACKUP_SOURCE_NAMES=${BACKUP_SOURCE_NAMES:-data}
      BACKUP_CONSISTENCY=${BACKUP_CONSISTENCY:-confirmed-cold-stop}
      BACKUP_STOP_MODE=${BACKUP_STOP_MODE:-container-stop}
      BACKUP_QUIESCE_HOOK=${BACKUP_QUIESCE_HOOK:-"/usr/local/libexec/game-backup/${game}"}
      LOCAL_RETENTION_DAYS=${LOCAL_RETENTION_DAYS:-14}
      NAS_RETENTION_DAYS=${NAS_RETENTION_DAYS:-7}
      AZURE_RETENTION_DAYS=${AZURE_RETENTION_DAYS:-90}
      BACKUP_STOP_TIMEOUT_SECONDS=${BACKUP_STOP_TIMEOUT_SECONDS:-120}
      RESTART_HEALTH_TIMEOUT_SECONDS=${RESTART_HEALTH_TIMEOUT_SECONDS:-480}

      IFS=: read -r -a source_names <<<"$BACKUP_SOURCE_NAMES"
      container=$CONTAINER_NAME
      consistency=$BACKUP_CONSISTENCY

      ((${#source_names[@]} > 0)) || {
        echo "At least one backup source is required" >&2
        exit 78
      }
      for source_name in "${source_names[@]}"; do
        if [[ ! "$source_name" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] ||
            [[ "/$source_name/" == *"/../"* ]]; then
          echo "Unsafe backup source: $source_name" >&2
          exit 78
        fi
      done
      [[ "$container" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || {
        echo "Invalid container name: $container" >&2
        exit 78
      }
      [[ "$consistency" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || {
        echo "Invalid backup consistency label: $consistency" >&2
        exit 78
      }
      [[ "$BACKUP_STOP_MODE" == container-stop || "$BACKUP_STOP_MODE" == hook ]] || {
        echo "BACKUP_STOP_MODE must be container-stop or hook" >&2
        exit 78
      }

      for value in \
        "$LOCAL_RETENTION_DAYS" \
        "$NAS_RETENTION_DAYS" \
        "$AZURE_RETENTION_DAYS" \
        "$BACKUP_STOP_TIMEOUT_SECONDS" \
        "$RESTART_HEALTH_TIMEOUT_SECONDS"; do
        [[ "$value" =~ ^[1-9][0-9]*$ ]] || {
          echo "Retention and timeout values must be positive integers" >&2
          exit 78
        }
      done

      if [[ "$dry_run" == true ]]; then
        cat <<EOF
      game=${game}
      container=${container}
      sources=${BACKUP_SOURCE_NAMES//:/ }
      consistency=${consistency}
      local=${BACKUP_ROOT}/local retention=${LOCAL_RETENTION_DAYS}d
      nas=${BACKUP_NAS_ROOT}/${game} retention=${NAS_RETENTION_DAYS}d
      azure=${AZURE_RCLONE_REMOTE}:${AZURE_CONTAINER} tier=${AZURE_ACCESS_TIER} retention=${AZURE_RETENTION_DAYS}d
      lifecycle=${BACKUP_STOP_MODE}, confirmed stop, restart health
      dry-run: no API, Docker, filesystem, NAS, or Azure changes were made
      EOF
        exit 0
      fi

      if [[ $EUID -ne 0 ]]; then
        echo "game-backup must run as root" >&2
        exit 77
      fi

      for command_name in docker flock mountpoint rclone sha256sum sync tar; do
        command -v "$command_name" >/dev/null || {
          echo "Required command is missing: $command_name" >&2
          exit 69
        }
      done

      local_dir="${BACKUP_ROOT}/local"
      health_dir="${BACKUP_ROOT}/health"
      work_dir="${BACKUP_ROOT}/work"
      event_log="${health_dir}/events.log"
      restart_state="${health_dir}/${game}.restart-required"
      mkdir -p "$local_dir" "$health_dir" "$work_dir"
      chmod 0750 "$BACKUP_ROOT" "$local_dir" "$health_dir" "$work_dir"
      touch "$event_log"
      chmod 0640 "$event_log"

      exec 9>"${BACKUP_ROOT}/.backup.lock"
      if ! flock -n 9; then
        echo "Another ${game} backup or restore operation holds ${BACKUP_ROOT}/.backup.lock" >&2
        exit 75
      fi

      log_event() {
        local line=$1
        printf '%s\n' "$line" | tee -a "$event_log"
      }

      record_result() {
        local destination=$1
        local status=$2
        local exit_code=${3:-}
        local line="game_backup_result game=${game} destination=${destination} status=${status}"
        if [[ -n "$exit_code" ]]; then
          line+=" exit_code=${exit_code}"
        fi
        log_event "$line"
      }

      record_success_marker() {
        local destination=$1
        local marker="${health_dir}/${game}-${destination}.success"
        local temporary="${marker}.new.$$"
        date +%s >"$temporary"
        sync -f "$temporary"
        mv -f "$temporary" "$marker"
        sync -f "$health_dir"
      }

      mark_restart_required() {
        local temporary="${restart_state}.new.$$"
        printf '%s\n' "$original_restart_policy" >"$temporary"
        sync -f "$temporary"
        mv -f "$temporary" "$restart_state"
        sync -f "$health_dir"
      }

      container_running() {
        [[ "$(docker inspect -f '{{.State.Running}}' "$container")" == true ]]
      }

      wait_for_stop() {
        local timeout=$1
        local deadline=$((SECONDS + timeout))
        while container_running; do
          if ((SECONDS >= deadline)); then
            echo "${container} did not stop within ${timeout} seconds" >&2
            return 1
          fi
          sleep 2
        done
      }

      wait_for_health() {
        local deadline=$((SECONDS + RESTART_HEALTH_TIMEOUT_SECONDS))
        local state health
        while ((SECONDS < deadline)); do
          state=$(docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null || true)
          health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container" 2>/dev/null || true)
          if [[ "$state" == true && "$health" == healthy ]]; then
            return 0
          fi
          if [[ "$state" != true && -n "$state" ]]; then
            echo "${container} stopped while waiting for health" >&2
            docker logs --tail 100 "$container" >&2 || true
            return 1
          fi
          sleep 5
        done
        echo "${container} did not become healthy within ${RESTART_HEALTH_TIMEOUT_SECONDS} seconds" >&2
        docker logs --tail 100 "$container" >&2 || true
        return 1
      }

      assert_cold() {
        if container_running; then
          echo "Refusing to archive while ${container} is running" >&2
          return 1
        fi
      }

      initially_running=false
      restart_required=false
      original_restart_policy=
      current_destination=local
      failure_recorded=false

      resume_game() {
        if [[ "$initially_running" != true ]]; then
          restart_required=false
          return 0
        fi
        docker update --restart="$original_restart_policy" "$container" >/dev/null || return
        if ! container_running; then
          docker start "$container" >/dev/null || return
        fi
        wait_for_health || return
        rm -f "$restart_state"
        sync -f "$health_dir"
        restart_required=false
      }

      cleanup() {
        local code=$?
        trap - EXIT HUP INT TERM
        set +e
        if [[ "$restart_required" == true ]]; then
          if ! resume_game; then
            log_event "game_backup_restart game=${game} status=failure container=${container}"
            code=1
          fi
        fi
        if ((code != 0)) && [[ "$failure_recorded" != true ]]; then
          record_result "$current_destination" failure "$code"
        fi
        find "$work_dir" -maxdepth 1 -type f -name '*.partial.*' -delete 2>/dev/null || true
        exit "$code"
      }
      trap cleanup EXIT
      trap 'exit 130' INT
      trap 'exit 143' HUP TERM

      if ! docker inspect "$container" >/dev/null 2>&1; then
        echo "Container does not exist: $container" >&2
        exit 69
      fi
      if container_running; then
        initially_running=true
        original_restart_policy=$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' "$container")
        [[ "$original_restart_policy" == unless-stopped || "$original_restart_policy" == always ]] || {
          echo "Unexpected restart policy for ${container}: ${original_restart_policy}" >&2
          exit 78
        }
      fi

      if [[ "$initially_running" == true ]]; then
        restart_required=true
        mark_restart_required
        docker update --restart=no "$container" >/dev/null
        if [[ "$BACKUP_STOP_MODE" == hook ]]; then
          [[ -x "$BACKUP_QUIESCE_HOOK" ]] || {
            echo "Backup quiesce hook is not executable: $BACKUP_QUIESCE_HOOK" >&2
            exit 78
          }
          "$BACKUP_QUIESCE_HOOK" "$container" "$BACKUP_STOP_TIMEOUT_SECONDS"
        else
          docker stop --time "$BACKUP_STOP_TIMEOUT_SECONDS" "$container" >/dev/null
        fi
        wait_for_stop "$BACKUP_STOP_TIMEOUT_SECONDS"
      fi
      assert_cold

      timestamp=$(date -u +%Y%m%dT%H%M%SZ)
      archive_name="${game}-${timestamp}.tar.gz"
      checksum_name="${archive_name}.sha256"
      metadata_name="${archive_name}.complete.json"
      archive_work="${work_dir}/${archive_name}.partial.$$"
      checksum_work="${work_dir}/${checksum_name}.partial.$$"
      metadata_work="${work_dir}/${metadata_name}.partial.$$"

      tar_arguments=(
        --create
        --gzip
        --file "$archive_work"
        --one-file-system
        --numeric-owner
        --acls
        --xattrs
        --directory "$DATA_ROOT"
      )
      tar "${tar_arguments[@]}" "${source_names[@]}"
      archive_sha=$(sha256sum "$archive_work" | awk '{print $1}')
      printf '%s  %s\n' "$archive_sha" "$archive_name" >"$checksum_work"
      created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      printf '{"schemaVersion":1,"status":"complete","game":"%s","createdUtc":"%s","archive":"%s","sha256":"%s","consistency":"%s"}\n' \
        "$game" "$created_utc" "$archive_name" "$archive_sha" "$consistency" >"$metadata_work"

      sync -f "$archive_work"
      sync -f "$checksum_work"
      sync -f "$metadata_work"
      mv "$archive_work" "${local_dir}/${archive_name}"
      mv "$checksum_work" "${local_dir}/${checksum_name}"
      mv "$metadata_work" "${local_dir}/${metadata_name}"
      sync -f "$local_dir"

      resume_game

      prune_filesystem() {
        local directory=$1
        local days=$2
        local marker base
        while IFS= read -r -d '' marker; do
          base=${marker%.complete.json}
          rm -f -- "$base" "${base}.sha256" "$marker"
        done < <(find "$directory" -maxdepth 1 -type f -name "${game}-*.tar.gz.complete.json" -mmin "+$((days * 1440))" -print0)
        find "$directory" -maxdepth 1 -type f -name '*.partial.*' -mmin +2880 -delete
      }

      prune_filesystem "$local_dir" "$LOCAL_RETENTION_DAYS"
      record_success_marker local
      record_result local success

      copy_filesystem_tier() {
        local destination=$1
        local destination_archive="${destination}/${archive_name}"
        mkdir -p "$destination"
        cp "${local_dir}/${archive_name}" "${destination_archive}.partial.$$"
        cp "${local_dir}/${checksum_name}" "${destination}/${checksum_name}.partial.$$"
        cp "${local_dir}/${metadata_name}" "${destination}/${metadata_name}.partial.$$"
        sync -f "${destination_archive}.partial.$$"
        sync -f "${destination}/${checksum_name}.partial.$$"
        sync -f "${destination}/${metadata_name}.partial.$$"
        mv "${destination_archive}.partial.$$" "$destination_archive"
        mv "${destination}/${checksum_name}.partial.$$" "${destination}/${checksum_name}"
        [[ "$(sha256sum "$destination_archive" | awk '{print $1}')" == "$archive_sha" ]]
        mv "${destination}/${metadata_name}.partial.$$" "${destination}/${metadata_name}"
        sync -f "$destination"
      }

      publish_nas() (
        set -Eeuo pipefail
        mountpoint -q "$BACKUP_NAS_ROOT"
        local destination="${BACKUP_NAS_ROOT}/${game}"
        copy_filesystem_tier "$destination"
        prune_filesystem "$destination" "$NAS_RETENTION_DAYS"
      )

      publish_azure() (
        set -Eeuo pipefail
        [[ -r "$AZURE_RCLONE_CONFIG" ]]
        [[ "$(stat -c %u "$AZURE_RCLONE_CONFIG")" == 0 ]]
        config_mode=$(stat -c %a "$AZURE_RCLONE_CONFIG")
        (( (8#$config_mode & 077) == 0 ))
        local destination="${AZURE_RCLONE_REMOTE}:${AZURE_CONTAINER}"
        local common_args=(--config "$AZURE_RCLONE_CONFIG" --azureblob-access-tier "$AZURE_ACCESS_TIER")
        rclone copyto "${local_dir}/${archive_name}" "${destination}/${archive_name}" "${common_args[@]}"
        rclone copyto "${local_dir}/${checksum_name}" "${destination}/${checksum_name}" "${common_args[@]}"
        rclone copyto "${local_dir}/${metadata_name}" "${destination}/${metadata_name}" "${common_args[@]}"
        rclone delete "$destination" --config "$AZURE_RCLONE_CONFIG" \
          --min-age "${AZURE_RETENTION_DAYS}d" \
          --include "${game}-*.tar.gz" \
          --include "${game}-*.tar.gz.sha256" \
          --include "${game}-*.tar.gz.complete.json"
      )

      destination_failed=false
      current_destination=nas
      set +e
      publish_nas
      nas_code=$?
      set -e
      if ((nas_code == 0)); then
        record_success_marker nas
        record_result nas success
      else
        record_result nas failure "$nas_code"
        destination_failed=true
      fi

      current_destination=azure
      set +e
      publish_azure
      azure_code=$?
      set -e
      if ((azure_code == 0)); then
        record_success_marker azure
        record_result azure success
      else
        record_result azure failure "$azure_code"
        destination_failed=true
      fi

      if [[ "$destination_failed" == true ]]; then
        failure_recorded=true
        exit 1
      fi

  - path: /usr/local/sbin/game-backup-health
    permissions: "0750"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      IFS=$'\n\t'
      umask 077

      game=${1:-}
      [[ "$game" =~ ^[a-z][a-z0-9-]*$ ]] || {
        echo "Usage: game-backup-health GAME_SLUG" >&2
        exit 64
      }

      config="/etc/game-backup/${game}.env"
      if [[ -r "$config" ]]; then
        # shellcheck disable=SC1090
        source "$config"
      fi

      DATA_ROOT=${DATA_ROOT:-"/data/${game}"}
      BACKUP_ROOT=${BACKUP_ROOT:-"${DATA_ROOT}/backups"}
      BACKUP_STALE_AFTER_SECONDS=${BACKUP_STALE_AFTER_SECONDS:-129600}
      health_dir="${BACKUP_ROOT}/health"
      event_log="${health_dir}/events.log"
      mkdir -p "$health_dir"
      touch "$event_log"

      now=$(date +%s)
      for destination in local nas azure; do
        marker="${health_dir}/${game}-${destination}.success"
        age=-1
        if [[ -s "$marker" ]]; then
          last=$(<"$marker")
          if [[ "$last" =~ ^[0-9]+$ ]]; then
            age=$((now - last))
          fi
        fi
        status=healthy
        if ((age < 0 || age > BACKUP_STALE_AFTER_SECONDS)); then
          status=stale
        fi
        line="game_backup_health game=${game} destination=${destination} status=${status} age_seconds=${age}"
        printf '%s\n' "$line" | tee -a "$event_log"
      done

  - path: /usr/local/sbin/game-backup-recover
    permissions: "0750"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      IFS=$'\n\t'
      umask 077

      game=${1:-}
      [[ "$game" =~ ^[a-z][a-z0-9-]*$ ]] || {
        echo "Usage: game-backup-recover GAME_SLUG" >&2
        exit 64
      }

      config="/etc/game-backup/${game}.env"
      if [[ -r "$config" ]]; then
        # shellcheck disable=SC1090
        source "$config"
      fi
      DATA_ROOT=${DATA_ROOT:-"/data/${game}"}
      BACKUP_ROOT=${BACKUP_ROOT:-"${DATA_ROOT}/backups"}
      CONTAINER_NAME=${CONTAINER_NAME:-"${game}-server"}
      RESTART_HEALTH_TIMEOUT_SECONDS=${RESTART_HEALTH_TIMEOUT_SECONDS:-480}
      container=$CONTAINER_NAME
      health_dir="${BACKUP_ROOT}/health"
      state_file="${health_dir}/${game}.restart-required"
      event_log="${health_dir}/events.log"

      [[ -s "$state_file" ]] || exit 0
      exec 9>"${BACKUP_ROOT}/.backup.lock"
      flock -n 9 || exit 75

      restart_policy=$(<"$state_file")
      [[ "$restart_policy" == unless-stopped || "$restart_policy" == always ]] || {
        echo "Invalid saved restart policy for ${game}" >&2
        exit 78
      }

      docker update --restart="$restart_policy" "$container" >/dev/null
      if [[ "$(docker inspect -f '{{.State.Running}}' "$container")" != true ]]; then
        docker start "$container" >/dev/null
      fi

      deadline=$((SECONDS + RESTART_HEALTH_TIMEOUT_SECONDS))
      while ((SECONDS < deadline)); do
        state=$(docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null || true)
        health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container" 2>/dev/null || true)
        if [[ "$state" == true && "$health" == healthy ]]; then
          rm -f "$state_file"
          sync -f "$health_dir"
          line="game_backup_result game=${game} destination=restart status=success"
          printf '%s\n' "$line" | tee -a "$event_log"
          exit 0
        fi
        [[ "$state" == true ]] || break
        sleep 5
      done

      line="game_backup_result game=${game} destination=restart status=failure exit_code=1"
      printf '%s\n' "$line" | tee -a "$event_log"
      docker logs --tail 100 "$container" >&2 || true
      exit 1

  - path: /usr/local/sbin/game-restore
    permissions: "0750"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      IFS=$'\n\t'
      umask 077

      usage() {
        echo "Usage: game-restore --game SLUG --archive PATH --destination PATH [--dry-run]" >&2
      }

      game=
      archive=
      destination=
      dry_run=false
      while (($#)); do
        case "$1" in
          --game) game=${2:-}; shift 2 ;;
          --archive) archive=${2:-}; shift 2 ;;
          --destination) destination=${2:-}; shift 2 ;;
          --dry-run) dry_run=true; shift ;;
          *) usage; exit 64 ;;
        esac
      done

      [[ "$game" =~ ^[a-z][a-z0-9-]*$ ]] || {
        usage
        exit 64
      }
      [[ -n "$archive" && -n "$destination" ]] || {
        usage
        exit 64
      }

      archive=$(realpath -e "$archive")
      destination=$(realpath -m "$destination")
      case "$destination/" in
        /|/data/*)
          echo "Refusing to restore into a live or unsafe path: $destination" >&2
          exit 77
          ;;
      esac
      [[ ! -e "$destination" ]] || {
        echo "Restore destination already exists: $destination" >&2
        exit 73
      }

      checksum_file="${archive}.sha256"
      metadata_file="${archive}.complete.json"
      [[ -r "$checksum_file" && -r "$metadata_file" ]] || {
        echo "Archive requires sibling .sha256 and .complete.json files" >&2
        exit 66
      }
      grep -Fq '"status":"complete"' "$metadata_file"
      grep -Fq "\"game\":\"${game}\"" "$metadata_file"
      expected=$(awk 'NR == 1 {print $1}' "$checksum_file")
      [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || {
        echo "Invalid checksum file: $checksum_file" >&2
        exit 65
      }
      actual=$(sha256sum "$archive" | awk '{print $1}')
      [[ "$actual" == "$expected" ]] || {
        echo "Checksum mismatch for $archive" >&2
        exit 65
      }
      grep -Fq "\"archive\":\"$(basename "$archive")\"" "$metadata_file"
      grep -Fq "\"sha256\":\"${actual}\"" "$metadata_file"

      while IFS= read -r entry; do
        case "$entry" in
          /*|../*|*/../*|*/..)
            echo "Unsafe archive entry: $entry" >&2
            exit 65
            ;;
        esac
      done < <(tar -tzf "$archive")

      if [[ "$dry_run" == true ]]; then
        echo "restore dry-run verified game=${game} archive=${archive} destination=${destination}"
        exit 0
      fi

      if [[ $EUID -ne 0 && "$destination" == /data/* ]]; then
        echo "Root is required for restores under /data" >&2
        exit 77
      fi

      backup_root="/data/${game}/backups"
      if [[ -d "$backup_root" ]]; then
        exec 9>"${backup_root}/.backup.lock"
        flock -n 9 || {
          echo "A ${game} backup or restore is already running" >&2
          exit 75
        }
      fi

      parent=$(dirname "$destination")
      name=$(basename "$destination")
      staging="${parent}/.${name}.restore.partial.$$"
      mkdir -p "$parent"
      [[ ! -e "$staging" ]]
      mkdir "$staging"
      cleanup() {
        local code=$?
        if ((code != 0)); then
          rm -rf -- "$staging"
        fi
        exit "$code"
      }
      trap cleanup EXIT
      tar --extract --gzip --file "$archive" --directory "$staging" --numeric-owner --acls --xattrs
      printf '%s\n' "$actual" >"${staging}/RESTORE_VERIFIED_SHA256"
      mv "$staging" "$destination"
      trap - EXIT
      echo "Restored verified ${game} backup to isolated path: ${destination}"

  - path: /etc/systemd/system/game-backup@.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Application-aware %i game backup
      After=docker.service network-online.target
      Wants=network-online.target
      Requires=docker.service
      ConditionPathExists=/etc/game-backup/rclone.conf

      [Service]
      Type=oneshot
      ExecStartPre=/usr/local/sbin/game-backup-recover %i
      ExecStart=/usr/local/sbin/game-backup --game %i
      TimeoutStartSec=30min
      Nice=10
      IOSchedulingClass=best-effort
      IOSchedulingPriority=7
      ProtectSystem=full
      PrivateDevices=false

  - path: /etc/systemd/system/game-backup@.timer
    permissions: "0644"
    content: |
      [Unit]
      Description=Daily application-aware %i game backup

      [Timer]
      OnCalendar=*-*-* 05:15:00
      RandomizedDelaySec=30m
      Persistent=true
      Unit=game-backup@%i.service

      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/game-backup-health@.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Report %i game backup freshness

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/game-backup-health %i
      ProtectSystem=full

  - path: /etc/systemd/system/game-backup-health@.timer
    permissions: "0644"
    content: |
      [Unit]
      Description=Check %i game backup freshness

      [Timer]
      OnBootSec=15m
      OnUnitActiveSec=15m
      Persistent=true
      Unit=game-backup-health@%i.service

      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/game-backup-recover@.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Recover %i after an interrupted game backup
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/game-backup-recover %i
      TimeoutStartSec=10min

      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl enable --now qemu-guest-agent

  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
      > /etc/apt/sources.list.d/docker.list
  - apt-get update -qq
  - env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  - curl -fsSL https://tailscale.com/install.sh | sh
  - systemctl enable --now tailscaled

  - |
    if ! id palworldsvc >/dev/null 2>&1; then
      echo "Expected Proxmox Cloud-Init user palworldsvc was not created" >&2
      exit 1
    fi
    if ! id birdo >/dev/null 2>&1; then
      useradd --create-home --shell /bin/bash birdo
    fi
    usermod -aG sudo birdo
  - install -d -m 0750 -o palworldsvc -g palworldsvc /data/palworld
  - install -d -m 0750 -o palworldsvc -g palworldsvc /data/palworld/data
  - install -d -m 0750 -o palworldsvc -g palworldsvc /data/palworld/config
  - install -d -m 0750 -o palworldsvc -g palworldsvc /data/palworld/tailscale
  - install -d -m 0750 -o palworldsvc -g palworldsvc /data/palworld/backups
  - install -d -m 0750 -o root -g palworldsvc /data/palworld/backups/local
  - install -d -m 0750 -o root -g palworldsvc /data/palworld/backups/health
  - install -d -m 0750 -o root -g palworldsvc /data/palworld/backups/work
  - install -d -m 0750 -o palworldsvc -g palworldsvc /data/palworld/monitoring
  - install -d -m 0750 -o palworldsvc -g palworldsvc /data/palworld/monitoring/alloy
  - install -d -m 0750 -o palworldsvc -g palworldsvc /data/palworld/portainer-edge-agent
  - install -d -m 0750 -o root -g root /etc/game-backup
  - install -d -m 0750 -o root -g root /usr/local/libexec/game-backup
  - install -d -m 0750 -o root -g root /mnt/nas-backups

  - |
    cat > /etc/sudoers.d/palworldsvc-game-node <<'EOF'
    palworldsvc ALL=(root) NOPASSWD: /usr/bin/docker, /usr/bin/docker compose, /usr/bin/systemctl status docker, /usr/bin/systemctl restart docker, /usr/bin/systemctl status tailscaled
    EOF
    chmod 0440 /etc/sudoers.d/palworldsvc-game-node
    visudo -cf /etc/sudoers.d/palworldsvc-game-node
    cat > /etc/sudoers.d/90-birdo-game-node <<'EOF'
    birdo ALL=(ALL:ALL) NOPASSWD: ALL
    EOF
    chmod 0440 /etc/sudoers.d/90-birdo-game-node
    visudo -cf /etc/sudoers.d/90-birdo-game-node

  - install -d -m 0700 -o palworldsvc -g palworldsvc /home/palworldsvc/.ssh
  - touch /home/palworldsvc/.ssh/authorized_keys
  - chmod 0600 /home/palworldsvc/.ssh/authorized_keys
  - chown palworldsvc:palworldsvc /home/palworldsvc/.ssh/authorized_keys
  - install -d -m 0700 -o birdo -g birdo /home/birdo/.ssh
  - touch /home/birdo/.ssh/authorized_keys
  - chmod 0600 /home/birdo/.ssh/authorized_keys
  - chown birdo:birdo /home/birdo/.ssh/authorized_keys
  - |
    cat > /etc/ssh/sshd_config.d/60-birdo.conf <<'EOF'
    Match User birdo
        PasswordAuthentication yes
        PubkeyAuthentication yes
    EOF
    chmod 0644 /etc/ssh/sshd_config.d/60-birdo.conf
    sshd -t
    systemctl reload ssh
  - systemctl daemon-reload
  - systemctl enable --now game-backup@palworld.timer
  - systemctl enable --now game-backup-health@palworld.timer
  - systemctl enable game-backup-recover@palworld.service

  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow from 192.168.86.0/24 to any port 7822 proto tcp comment 'OpenSSH management'
  - ufw allow from 192.168.69.159/32 to any port 7822 proto tcp comment 'OpenSSH management'

  - ufw allow in on tailscale0 to any port 22 proto tcp comment 'Tailscale SSH'
  - ufw allow in on tailscale0 to any port 7822 proto tcp comment 'OpenSSH over Tailscale'
  - ufw --force enable

final_message: "Palworld game node provisioning completed"
