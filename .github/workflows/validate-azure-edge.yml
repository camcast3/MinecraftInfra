---
name: Validate Azure edge

on:
  pull_request:
    paths:
      - "contracts/**"
      - "platform/contracts/**"
      - "docker/azure/**"
      - "platform/azure/edge/**"
      - "docker/palworld/docker-compose.yml"
      - "games/palworld/docker-compose.yml"
      - "docker/windrose/docker-compose.yml"
      - "games/windrose/docker-compose.yml"
      - "infra/azure/**"
      - "platform/azure/iac/**"
      - "infra/proxmox/game-node/**"
      - "platform/proxmox/game-node/**"
      - "scripts/tests/Test-AzureEdge.ps1"
      - "tools/layout/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "platform/contracts/**"
      - "docker/azure/**"
      - "platform/azure/edge/**"
      - "docker/palworld/docker-compose.yml"
      - "games/palworld/docker-compose.yml"
      - "docker/windrose/docker-compose.yml"
      - "games/windrose/docker-compose.yml"
      - "infra/azure/**"
      - "platform/azure/iac/**"
      - "infra/proxmox/game-node/**"
      - "platform/proxmox/game-node/**"
      - "scripts/tests/Test-AzureEdge.ps1"
      - "tools/layout/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    name: Compose, Bicep, and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Test Azure edge rendering and policy
        shell: pwsh
        run: |
          ./tools/layout/Test-RepositoryLayout.ps1
          ./scripts/tests/Test-AzureEdge.ps1

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
