---
name: Validate game contracts

on:
  workflow_call:
  pull_request:
    paths:
      - "contracts/**"
      - "platform/contracts/**"
      - "docker/azure/docker-compose.yml"
      - "platform/azure/edge/docker-compose.yml"
      - "docker/proxmox/docker-compose.yml"
      - "games/minecraft/c2e2/docker-compose.yml"
      - "docker/palworld/**"
      - "games/palworld/**"
      - "docker/windrose/**"
      - "games/windrose/**"
      - "infra/azure/main.bicep"
      - "infra/azure/modules/backup-storage.bicep"
      - "infra/azure/parameters/prod.bicepparam"
      - "platform/azure/iac/**"
      - "infra/azure/scripts/bootstrap.ps1"
      - "infra/proxmox/cloud-init.yaml"
      - "platform/proxmox/minecraft/cloud-init.yaml"
      - "infra/proxmox/game-node/**"
      - "platform/proxmox/game-node/**"
      - "scripts/Validate-GameContracts.ps1"
      - "tools/validation/Validate-GameContracts.ps1"
      - "scripts/tests/Test-GameContracts.ps1"
      - "scripts/tests/Test-GameBackups.sh"
      - "tools/layout/**"
      - ".github/workflows/validate-game-contracts.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "platform/contracts/**"
      - "docker/azure/docker-compose.yml"
      - "platform/azure/edge/docker-compose.yml"
      - "docker/proxmox/docker-compose.yml"
      - "games/minecraft/c2e2/docker-compose.yml"
      - "docker/palworld/**"
      - "games/palworld/**"
      - "docker/windrose/**"
      - "games/windrose/**"
      - "infra/azure/main.bicep"
      - "infra/azure/modules/backup-storage.bicep"
      - "infra/azure/parameters/prod.bicepparam"
      - "platform/azure/iac/**"
      - "infra/azure/scripts/bootstrap.ps1"
      - "infra/proxmox/cloud-init.yaml"
      - "platform/proxmox/minecraft/cloud-init.yaml"
      - "infra/proxmox/game-node/**"
      - "platform/proxmox/game-node/**"
      - "scripts/Validate-GameContracts.ps1"
      - "tools/validation/Validate-GameContracts.ps1"
      - "scripts/tests/Test-GameContracts.ps1"
      - "scripts/tests/Test-GameBackups.sh"
      - "tools/layout/**"
      - ".github/workflows/validate-game-contracts.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Contracts and repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate contracts
        shell: pwsh
        run: |
          ./tools/layout/Test-RepositoryLayout.ps1
          ./tools/validation/Validate-GameContracts.ps1

      - name: Test rejection policies
        shell: pwsh
        run: ./scripts/tests/Test-GameContracts.ps1

      - name: Test game backup tooling
        shell: bash
        run: |
          bash -n platform/proxmox/game-node/backup/*.sh scripts/tests/Test-GameBackups.sh
          bash ./scripts/tests/Test-GameBackups.sh
