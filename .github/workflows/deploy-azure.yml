name: Deploy Azure VM & Stack

on:
  push:
    branches: [main]
    paths:
      - 'infra/azure/**'
      - 'docker/azure/**'
      - 'docker/shared/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to deploy (default: main)'
        required: false
        default: 'main'
        type: string

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 2   # needed for git diff HEAD~1

      - name: Resolve deploy commit
        id: deploy_commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate operators match whitelist
        shell: pwsh
        run: ./scripts/sync-ops.ps1 -Check

      - name: Validate Azure edge contract
        shell: pwsh
        run: ./scripts/tests/Test-AzureEdge.ps1

      # Log in to Azure via OIDC — no stored credentials, token is short-lived
      # Docs: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep
        run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null

      - name: Create resource group (idempotent)
        run: |
          az group create \
            --name rg-minecraft-prod \
            --location westus \
            --tags environment=prod

      # Only redeploy Bicep when infra files changed or the workflow was triggered manually.
      # osProfile.customData is immutable on existing VMs — Bicep would fail if we always
      # redeployed and vm.bicep changed. Docker-only pushes skip this step entirely.
      - name: Check if infra changed
        id: infra_check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^infra/azure/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Bicep (infra + VM)
        if: steps.infra_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          az deployment group create \
            --resource-group rg-minecraft-prod \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/prod.bicepparam

      # Pull latest images and restart the Azure stack.
      # Uses az vm run-command so no SSH key or Tailscale tunnel is needed —
      # the runner's OIDC Azure session (Contributor on the RG) is sufficient.
      # Commands run as root on the VM; refresh-env.sh re-fetches KV secrets
      # and rewrites /opt/minecraft/secrets/* + velocity.toml before the
      # compose restart.
      #
      # Security: resolve the requested ref at checkout, then pass only the
      # resulting full commit SHA to Azure Run Command. The VM validates the
      # SHA again before fetching and checking out the immutable revision.
      - name: Deploy Docker stack
        env:
          DEPLOY_SHA: ${{ steps.deploy_commit.outputs.sha }}
        run: |
          case "$DEPLOY_SHA" in
            "" | *[!0-9a-f]*)
              echo "Refusing to deploy invalid commit SHA: '$DEPLOY_SHA'" >&2
              exit 1
              ;;
          esac
          if [ "${#DEPLOY_SHA}" -ne 40 ]; then
            echo "Expected a full 40-character commit SHA, got '$DEPLOY_SHA'" >&2
            exit 1
          fi
          # shellcheck disable=SC2016
          result="$(az vm run-command invoke \
            --resource-group rg-minecraft-prod \
            --name vm-minecraft-prod \
            --command-id RunShellScript \
            --parameters "deploySha=$DEPLOY_SHA" \
            --scripts '
              export HOME=/root
              set -euo pipefail
              # az vm run-command passes --parameters as positional args to
              # the script ($1, $2, ...). Strip the "deploySha=" prefix with
              # bash parameter expansion (no eval, no command substitution).
              SHA="${1#deploySha=}"
              case "$SHA" in
                ????????-*) echo "Invalid deploy SHA received on VM" >&2; exit 1 ;;
                *[!0-9a-f]* | "") echo "Invalid deploy SHA received on VM" >&2; exit 1 ;;
              esac
              if [ "${#SHA}" -ne 40 ]; then
                echo "Invalid deploy SHA length received on VM" >&2
                exit 1
              fi
              # /opt/minecraft is owned by the admin user; this script runs
              # as root via Azure run-command. --system writes /etc/gitconfig
              # and doesnt depend on $HOME.
              git config --system --add safe.directory /opt/minecraft
              cd /opt/minecraft
              git fetch origin "$SHA"
              git checkout --detach --force "$SHA"
              bash docker/azure/reconcile-firewall.sh
              bash docker/azure/refresh-env.sh
              docker compose -f docker/azure/docker-compose.yml pull
              docker compose -f docker/azure/docker-compose.yml up \
                -d --remove-orphans --wait --wait-timeout 180
              echo "DEPLOY_AZURE_OK:$SHA"
            ' \
            --output json)"
          message="$(jq -r '[.value[].message] | join("\n")' <<<"$result")"
          printf '%s\n' "$message"
          grep -Fq "DEPLOY_AZURE_OK:$DEPLOY_SHA" <<<"$message" || {
            echo "Azure VM deployment did not return its success marker." >&2
            exit 1
          }
