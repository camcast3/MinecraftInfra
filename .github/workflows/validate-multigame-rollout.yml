---
name: Validate multi-game rollout

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "contracts/**"
      - "platform/contracts/**"
      - "docker/azure/**"
      - "platform/azure/edge/**"
      - "docker/palworld/**"
      - "games/palworld/**"
      - "docker/windrose/**"
      - "games/windrose/**"
      - "infra/azure/**"
      - "platform/azure/iac/**"
      - "infra/proxmox/game-node/**"
      - "platform/proxmox/game-node/**"
      - "ops/**"
      - "scripts/Invoke-MultigameRolloutValidation.ps1"
      - "scripts/tests/**"
      - "tools/validation/**"
      - "tools/layout/**"
      - ".github/workflows/validate-multigame-rollout.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "platform/contracts/**"
      - "docker/azure/**"
      - "platform/azure/edge/**"
      - "docker/palworld/**"
      - "games/palworld/**"
      - "docker/windrose/**"
      - "games/windrose/**"
      - "infra/azure/**"
      - "platform/azure/iac/**"
      - "infra/proxmox/game-node/**"
      - "platform/proxmox/game-node/**"
      - "ops/**"
      - "scripts/Invoke-MultigameRolloutValidation.ps1"
      - "scripts/tests/**"
      - "tools/validation/**"
      - "tools/layout/**"
      - ".github/workflows/validate-multigame-rollout.yml"

permissions:
  contents: read

jobs:
  preproduction:
    name: Isolated rollout validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install cloud-init schema validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloud-init

      - name: Validate Palworld then Windrose rollout
        shell: pwsh
        run: ./tools/validation/Invoke-MultigameRolloutValidation.ps1
