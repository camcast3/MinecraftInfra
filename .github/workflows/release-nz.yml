---
name: Release nz client

# Publishes an immutable commit-versioned release first, then refreshes the
# nz-latest production release. Its metadata always points back to the
# immutable binary and its SHA-256.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "scripts/Test-ClientDistribution.ps1"
      - "scripts/Test-MinecraftStatus.ps1"
      - ".github/workflows/release-nz.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-nz
  cancel-in-progress: false

jobs:
  validate-and-release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v7
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum

      - name: Unit tests and vet
        working-directory: client
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full nz E2E
        working-directory: client
        shell: pwsh
        run: go test -tags e2e -v -timeout 10m ./tests/e2e/

      - name: Synthetic instance corpus compatibility
        shell: pwsh
        run: ./client/scripts/Test-InstanceCorpus.ps1

      - name: Disposable package validation
        shell: pwsh
        run: ./client/scripts/Test-Packaging.ps1

      - name: Client distribution and docs policy
        shell: pwsh
        run: ./scripts/Test-ClientDistribution.ps1

      - name: Build immutable release files
        id: meta
        shell: pwsh
        run: |
          $short = '${{ github.sha }}'.Substring(0, 12)
          $tag = "nz-v$short"
          $out = Join-Path $PWD '.artifacts\nz-release'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Push-Location client
          try {
            go build -trimpath `
              -ldflags "-X github.com/camcast3/MinecraftInfra/client/cmd/nz/cmd.version=$tag" `
              -o (Join-Path $out 'nz.exe') ./cmd/nz/
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          $binary = Join-Path $out 'nz.exe'
          $sha = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $binary).Length
          $builtAt = (git show -s --format=%cI '${{ github.sha }}').Trim()
          $modpackMatch = Select-String -Path modpack.yml -Pattern '^version:\s*"([^"]+)"\s*$'
          if (-not $modpackMatch) { throw 'Could not parse modpack.yml version.' }
          $modpackVersion = $modpackMatch.Matches[0].Groups[1].Value
          $metadata = [ordered]@{
            schemaVersion = 1
            tag = $tag
            version = $tag
            commit = '${{ github.sha }}'
            builtAt = $builtAt
            binary = [ordered]@{
              name = 'nz.exe'
              url = "https://github.com/${{ github.repository }}/releases/download/$tag/nz.exe"
              sha256 = $sha
              sizeBytes = $size
            }
            compatibility = [ordered]@{
              os = 'windows'
              arch = 'amd64'
              modpackVersion = $modpackVersion
              minecraft = '1.20.1'
              javaMajor = 17
              manifestSchema = 1
              preserveListSchema = 1
              transactionSchema = 1
            }
            gates = [ordered]@{
              goTest = $true
              goVet = $true
              e2e = $true
              corpus = $true
              packaging = $true
              distributionPolicy = $true
              staticLaunch = $true
              serverHealth = $true
            }
          }
          $metadata | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $out 'nz-release.json') -Encoding UTF8 -NoNewline
          "$sha *nz.exe" |
            Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS') -Encoding ASCII -NoNewline
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify metadata, checksum, static launch, and installer
        shell: pwsh
        run: |
          ./client/scripts/Test-NzRelease.ps1 `
            -NzExe .artifacts/nz-release/nz.exe `
            -Metadata .artifacts/nz-release/nz-release.json `
            -Checksums .artifacts/nz-release/SHA256SUMS

      - name: Verify current server health and compatibility
        shell: pwsh
        run: |
          $match = Select-String -Path modpack.yml -Pattern '^version:\s*"([^"]+)"\s*$'
          if (-not $match) { throw 'Could not parse modpack.yml version.' }
          ./scripts/Test-MinecraftStatus.ps1 `
            -ExpectedVersion $match.Matches[0].Groups[1].Value `
            -Attempts 6 -DelaySeconds 20

      - name: Publish immutable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.meta.outputs.tag }}'
          $out = Join-Path $PWD '.artifacts\nz-release'
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            $published = Join-Path $out 'published'
            New-Item -ItemType Directory -Path $published -Force | Out-Null
            gh release download $tag --repo $env:GITHUB_REPOSITORY --dir $published
            foreach ($name in @('nz.exe', 'nz-release.json', 'SHA256SUMS', 'install.ps1')) {
              $local = if ($name -eq 'install.ps1') {
                Join-Path $PWD 'client\scripts\install.ps1'
              } else {
                Join-Path $out $name
              }
              $remote = Join-Path $published $name
              if (-not (Test-Path -LiteralPath $remote) -or
                  (Get-FileHash $remote -Algorithm SHA256).Hash -ne
                  (Get-FileHash $local -Algorithm SHA256).Hash) {
                throw "Immutable release $tag already exists with different $name bytes."
              }
            }
            Write-Host "Immutable release $tag already exists with matching assets."
          } else {
            gh release create $tag `
              (Join-Path $out 'nz.exe') `
              (Join-Path $out 'nz-release.json') `
              (Join-Path $out 'SHA256SUMS') `
              client/scripts/install.ps1 `
              --repo $env:GITHUB_REPOSITORY `
              --target '${{ github.sha }}' `
              --title "nz client $tag" `
              --notes "Immutable gated Windows/amd64 nz release. See nz-release.json and SHA256SUMS." `
              --prerelease
          }

      - name: Promote nz-latest production release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view nz-latest --repo $env:GITHUB_REPOSITORY 2>$null) {
            # Keep the alias continuously available. The manifest is uploaded
            # last and acts as the commit point because installers resolve the
            # immutable versioned release through it.
            gh release upload nz-latest `
              client/scripts/install.ps1 `
              --repo $env:GITHUB_REPOSITORY --clobber
            gh release upload nz-latest `
              .artifacts/nz-release/nz.exe `
              .artifacts/nz-release/SHA256SUMS `
              --repo $env:GITHUB_REPOSITORY --clobber
            gh release upload nz-latest `
              .artifacts/nz-release/nz-release.json `
              --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit nz-latest `
              --repo $env:GITHUB_REPOSITORY `
              --title 'nz client (gated production)' `
              --notes "Production bootstrap for ${{ steps.meta.outputs.tag }}. install.ps1 resolves nz-release.json, downloads the immutable asset, and verifies SHA-256." `
              --latest
          } else {
            gh release create nz-latest `
              .artifacts/nz-release/nz.exe `
              .artifacts/nz-release/nz-release.json `
              .artifacts/nz-release/SHA256SUMS `
              client/scripts/install.ps1 `
              --repo $env:GITHUB_REPOSITORY `
              --target '${{ github.sha }}' `
              --title 'nz client (gated production)' `
              --notes "Production bootstrap for ${{ steps.meta.outputs.tag }}. install.ps1 resolves nz-release.json, downloads the immutable asset, and verifies SHA-256." `
              --latest
          }
