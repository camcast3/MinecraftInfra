# LuckPerms (Forge) configuration — HOCON format.
# LuckPerms does not use TOML for its main config; the file MUST be named
# luckperms.conf and use HOCON, regardless of the storage-method chosen below.
#
# Managed by packwiz: this file is indexed in packwiz/index.toml and installed
# to /data/config/luckperms.conf by packwiz-installer on every container start.
# Unlike the APPLY_EXTRA_FILES configs (PCF, prometheus-exporter), packwiz
# RECONCILES this file on each redeploy — edit it here, republish the pack, and
# the change propagates automatically without deleting anything on the host.
#
# LuckPerms reads this config at startup only; group/user data lives separately
# in /data/luckperms/ (h2), so packwiz re-syncing the config never clobbers
# permission data.
#
# Any option omitted here falls back to LuckPerms' built-in default — the
# upstream config header guarantees this ("Default values are used if an option
# cannot be found"), so this file only needs to carry the settings we care about.
#
# Full option reference: https://luckperms.net/wiki/Configuration

# +----------------------------------------------------------------------------+ #
# |                            ESSENTIAL SETTINGS                              | #
# +----------------------------------------------------------------------------+ #

# Server identifier used for server-specific (context) permissions.
# "global" effectively disables the per-server context. We run a single C2E2
# backend, so "global" is correct; change only if this server joins a network
# of LuckPerms backends sharing one database.
server = "global"

# Fall back to the server's own UUID cache / Mojang lookup when LuckPerms has
# no record for a player yet. Velocity already authenticates players at the
# proxy, so usernames resolve fine; leaving this false keeps lookups local.
use-server-uuid-cache = false

# +----------------------------------------------------------------------------+ #
# |                             STORAGE SETTINGS                               | #
# +----------------------------------------------------------------------------+ #

# How LuckPerms stores permission data.
# - h2 is a local flatfile DB written to /data/luckperms/ — persisted in the
#   c2e2 data volume and included in the mc-backup tarballs. Ideal for a single
#   backend with no external database.
# - Switch to "mysql"/"mariadb" only if you later run multiple backend servers
#   that must share one permission set (also set sync-minutes or a messaging
#   service below, and fill in the data{} block).
# Storage-type reference: https://luckperms.net/wiki/Storage-types
storage-method = "h2"

# +----------------------------------------------------------------------------+ #
# |                    UPDATE PROPAGATION & MESSAGING                          | #
# +----------------------------------------------------------------------------+ #

# How often (minutes) LuckPerms polls storage to refresh data. Only useful with
# a shared remote database and no messaging service. -1 disables it, which is
# correct for our single-backend H2 setup.
sync-minutes = -1

# Watch the local data files for manual edits and hot-reload on change.
# Harmless and convenient with h2/flatfile storage.
watch-files = true
